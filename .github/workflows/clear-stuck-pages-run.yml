name: Clear stuck Pages run

on:
  push:
    paths:
      - .github/workflows/clear-stuck-pages-run.yml

permissions:
  actions: write
  contents: read
  pages: write

jobs:
  clear-stuck-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 31102903433;
            const pagesDeploymentId = "dd3167f6f757582b384c0611ed30ed7cb6c0f974";

            try {
              await github.request(
                "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: pagesDeploymentId,
                }
              );
              core.info(`Cancelled Pages deployment ${pagesDeploymentId}.`);
            } catch (error) {
              core.setFailed(`Pages deployment cancellation failed: ${error.message}`);
              return;
            }

            try {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              core.info(`Cancellation requested for workflow run ${runId}.`);
            } catch (error) {
              core.warning(`Workflow cancellation request returned: ${error.message}`);
            }
