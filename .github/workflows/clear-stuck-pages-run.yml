name: Clear stuck Pages run

on:
  push:
    paths:
      - .github/workflows/clear-stuck-pages-run.yml

permissions:
  actions: write
  contents: read

jobs:
  clear-stuck-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel or delete stuck Pages workflow run
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 31102903433;

            try {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              core.info(`Cancellation requested for workflow run ${runId}.`);
            } catch (error) {
              core.warning(`Cancellation request failed: ${error.message}`);
            }

            await new Promise((resolve) => setTimeout(resolve, 5000));

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            if (run.status === "queued") {
              core.warning(`Run ${runId} is still queued; deleting the stale run record.`);
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
            } else {
              core.info(`Run ${runId} status after cancellation: ${run.status}.`);
            }
